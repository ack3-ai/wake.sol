[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "wake.sol"
version = "0.1.0"
description = "Python testing/fuzzing harness for Solana programs on top of litesvm"
readme = "README.md"
license = "ISC"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Ack3" }]
keywords = ["solana", "svm", "litesvm", "testing", "fuzzing", "anchor", "audit"]
dependencies = [
    "click>=8.0",
    "pytest>=7.0",
    "rich>=13.0",
    "ipdb>=0.13",
    "tblib>=3.0",  # pickle tracebacks across the multiprocess runner's queue
    # Re-exported as `wake_sol.OrderedSet`. A plain `set` iterates in hash
    # order, and `Account` hashes change every run, so iterating one inside a flow
    # or invariant makes a seeded campaign non-reproducible. Never use `set` in a
    # fuzz test; use this.
    "ordered-set>=4.1",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Framework :: Pytest",
]

[project.urls]
Homepage = "https://github.com/ack3-ai/wake.sol"
Repository = "https://github.com/ack3-ai/wake.sol"
Documentation = "https://github.com/ack3-ai/wake.sol/blob/main/docs/index.md"
Issues = "https://github.com/ack3-ai/wake.sol/issues"

[project.scripts]
wake-sol = "wake_sol.cli:main"

[project.entry-points.pytest11]
wake_sol = "wake_sol._pytest_plugin"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "wake_sol._native"
